<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Ordem dos Sustenidos</title>
<style>
:root{--bg:#0b0b0d;--panel:#17181c;--panel2:#202228;--text:#f5f7fa;--muted:#aeb4bf;--border:#323640;--accent:#4f7cff;--good:#58c77a;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:28px 18px 48px}
h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.4rem)}
.subtitle{color:var(--muted);margin:0 0 20px;line-height:1.5}
.chain{font-size:clamp(1.2rem,3.8vw,2rem);font-weight:700;letter-spacing:.02em;padding:18px;background:var(--panel);border:1px solid var(--border);border-radius:16px;text-align:center;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px}
.stat small{display:block;color:var(--muted);margin-bottom:4px}.stat b{font-size:1.35rem}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}
.layer{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.question{font-size:1.35rem;font-weight:700;line-height:1.35;margin-bottom:16px}
.options{display:grid;gap:10px}
.option{width:100%;text-align:left;border:1px solid var(--border);background:#101116;color:var(--text);padding:13px 14px;border-radius:12px;font-size:1rem;cursor:pointer}
.option:hover{border-color:var(--accent)}
.option.selected{outline:2px solid var(--accent)}
.option.correct{border-color:var(--good);background:rgba(88,199,122,.10)}
.option.wrong{border-color:var(--bad);background:rgba(255,107,107,.10)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button.action{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--border);background:#111318;color:var(--text);font-weight:700;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:white}
.feedback{margin-top:16px;min-height:54px;background:var(--panel2);border-radius:12px;padding:13px;line-height:1.5}
.good{color:var(--good);font-weight:700}.bad{color:var(--bad);font-weight:700}
.multi-note{color:var(--muted);font-size:.9rem;margin-top:6px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
  <h1>Quiz — Ordem dos Sustenidos</h1>
  <p class="subtitle">Treino infinito. Sem escalas e sem bemóis. As perguntas usam apenas a cadeia dos sustenidos, a posição de cada nota e quais notas aparecem quando há 1–7 sustenidos.</p>
  <div class="chain">Fá♯ → Dó♯ → Sol♯ → Ré♯ → Lá♯ → Mi♯ → Si♯</div>

  <div class="stats">
    <div class="stat"><small>Corretas</small><b id="correct">0</b></div>
    <div class="stat"><small>Tentativas</small><b id="attempts">0</b></div>
    <div class="stat"><small>Precisão</small><b id="accuracy">—</b></div>
    <div class="stat"><small>Streak</small><b id="streak">0</b></div>
  </div>

  <section class="card">
    <div id="layer" class="layer"></div>
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <div class="actions">
      <button id="check" class="action primary">Check</button>
      <button id="next" class="action">Próxima</button>
      <button id="reveal" class="action">Revelar</button>
      <button id="reset" class="action">Zerar placar</button>
    </div>
    <div id="feedback" class="feedback">Escolha a resposta.</div>
  </section>
</main>

<script>
(() => {
  const sharps = ['Fá♯','Dó♯','Sol♯','Ré♯','Lá♯','Mi♯','Si♯'];
  const layerEl = document.getElementById('layer');
  const qEl = document.getElementById('question');
  const optionsEl = document.getElementById('options');
  const feedback = document.getElementById('feedback');
  const correctEl = document.getElementById('correct');
  const attemptsEl = document.getElementById('attempts');
  const accuracyEl = document.getElementById('accuracy');
  const streakEl = document.getElementById('streak');

  let current = null;
  let selected = new Set();
  let graded = false;
  let correct = Number(localStorage.getItem('sharpQuizCorrect') || 0);
  let attempts = Number(localStorage.getItem('sharpQuizAttempts') || 0);
  let streak = Number(localStorage.getItem('sharpQuizStreak') || 0);
  let lastSig = '';

  function saveStats(){
    localStorage.setItem('sharpQuizCorrect', correct);
    localStorage.setItem('sharpQuizAttempts', attempts);
    localStorage.setItem('sharpQuizStreak', streak);
  }
  function updateStats(){
    correctEl.textContent=correct;
    attemptsEl.textContent=attempts;
    accuracyEl.textContent=attempts?Math.round(correct/attempts*100)+'%':'—';
    streakEl.textContent=streak;
    saveStats();
  }
  function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function sampleWrong(correctValue, n=3){
    return shuffle(sharps.filter(x=>x!==correctValue)).slice(0,n);
  }
  function makeSingle(question, answer, layer, optionPool=null){
    const wrongs = optionPool ? shuffle(optionPool.filter(x=>x!==answer)).slice(0,3) : sampleWrong(answer,3);
    return {type:'single',layer,question,answers:[answer],options:shuffle([answer,...wrongs])};
  }
  function makeQuestion(){
    let q, sig;
    do{
      const layer = Math.floor(Math.random()*3);
      if(layer===0){
        const dir = Math.random()<.5?'after':'before';
        if(dir==='after'){
          const i=Math.floor(Math.random()*6);
          q=makeSingle('Qual sustenido vem imediatamente depois de '+sharps[i]+'?',sharps[i+1],'Camada 1 — ordem');
        }else{
          const i=1+Math.floor(Math.random()*6);
          q=makeSingle('Qual sustenido vem imediatamente antes de '+sharps[i]+'?',sharps[i-1],'Camada 1 — ordem');
        }
      }else if(layer===1){
        if(Math.random()<.5){
          const i=Math.floor(Math.random()*7);
          const nums=['1ª','2ª','3ª','4ª','5ª','6ª','7ª'];
          q=makeSingle('Qual é o '+nums[i]+' sustenido da ordem?',sharps[i],'Camada 2 — posição');
        }else{
          const i=Math.floor(Math.random()*7);
          const nums=['1ª','2ª','3ª','4ª','5ª','6ª','7ª'];
          q={type:'single',layer:'Camada 2 — posição',question:sharps[i]+' ocupa qual posição na ordem?',answers:[nums[i]],options:shuffle(nums.filter(x=>x!==nums[i])).slice(0,3).concat([nums[i]])};
          q.options=shuffle(q.options);
        }
      }else{
        const count=1+Math.floor(Math.random()*7);
        const correctSet=sharps.slice(0,count);
        if(count===7){
          q={type:'multi',layer:'Camada 3 — conjunto de alterações',question:'Uma armadura com 7 sustenidos altera quais notas?',answers:[...correctSet],options:[...sharps]};
        }else{
          const distractors=sharps.slice(count);
          const chosenCorrect=shuffle(correctSet).slice(0,Math.min(3,correctSet.length));
          const chosenWrong=shuffle(distractors).slice(0,Math.max(1,4-chosenCorrect.length));
          let opts=shuffle([...chosenCorrect,...chosenWrong]).slice(0,4);
          // Ensure at least 2 correct in multi-select when possible
          if(correctSet.length>=2 && opts.filter(x=>correctSet.includes(x)).length<2){
            opts[0]=correctSet[0]; opts[1]=correctSet[1]; opts=[...new Set(opts)];
          }
          q={type:'multi',layer:'Camada 3 — conjunto de alterações',question:'Uma armadura com '+count+' sustenido'+(count>1?'s':'')+' contém quais destas notas alteradas?',answers:opts.filter(x=>correctSet.includes(x)),options:opts};
        }
      }
      sig=q.layer+'|'+q.question+'|'+q.answers.join(',');
    }while(sig===lastSig);
    lastSig=sig;
    current=q;selected.clear();graded=false;render();
  }
  function render(){
    layerEl.textContent=current.layer;
    qEl.textContent=current.question;
    optionsEl.innerHTML='';
    current.options.forEach(opt=>{
      const b=document.createElement('button');
      b.className='option';
      b.textContent=opt;
      b.dataset.value=opt;
      b.onclick=()=>{
        if(graded)return;
        if(current.type==='single'){
          selected.clear();
          [...optionsEl.children].forEach(x=>x.classList.remove('selected'));
          selected.add(opt);b.classList.add('selected');
        }else{
          if(selected.has(opt)){selected.delete(opt);b.classList.remove('selected')}
          else{selected.add(opt);b.classList.add('selected')}
        }
      };
      optionsEl.appendChild(b);
    });
    feedback.innerHTML=current.type==='multi'
      ? 'Selecione todas as respostas corretas e clique em <strong>Check</strong>.'
      : 'Escolha uma resposta e clique em <strong>Check</strong>.';
  }
  function sameSet(a,b){
    if(a.size!==b.size)return false;
    for(const x of a)if(!b.has(x))return false;
    return true;
  }
  function grade(){
    if(graded)return;
    if(selected.size===0){feedback.textContent='Escolha pelo menos uma resposta.';return;}
    graded=true;attempts++;
    const correctSet=new Set(current.answers);
    const ok=sameSet(selected,correctSet);
    [...optionsEl.children].forEach(btn=>{
      const v=btn.dataset.value;
      if(correctSet.has(v))btn.classList.add('correct');
      else if(selected.has(v))btn.classList.add('wrong');
    });
    if(ok){
      correct++;streak++;
      feedback.innerHTML='<span class="good">✓ Correto.</span> '+current.answers.join(', ');
    }else{
      streak=0;
      feedback.innerHTML='<span class="bad">✗ Incorreto.</span> Resposta correta: '+current.answers.join(', ');
    }
    updateStats();
  }
  document.getElementById('check').onclick=grade;
  document.getElementById('next').onclick=makeQuestion;
  document.getElementById('reveal').onclick=()=>{feedback.innerHTML='Resposta: <strong>'+current.answers.join(', ')+'</strong>';};
  document.getElementById('reset').onclick=()=>{correct=0;attempts=0;streak=0;updateStats();makeQuestion();};
  updateStats();makeQuestion();
})();
</script>
</body>
</html>
